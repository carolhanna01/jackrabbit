      description: "<p>The merge context uses the NameSet.equals(NameSet) method to\
        \ compare two sets; however, the NameSet class does not override the default\
        \ Object.equals(Object) method, and does not inherit from AbstractSet&lt;E&gt;.\
        \  Therefore, the merge check fails, even though the mixin sets are the same.\
        \  Object instance equivalence is being performed as opposed to set equivalence.\
        \  Behavior is observed when more than one thread is checking the ISM at a\
        \ given time.  Demonstration code available upon request.</p>\n\n<p>From NodeStateMerger,\
        \ line 83:<br/>\n                // mixin types<br/>\n                if (!state.getMixinTypeNames().equals(overlayedState.getMixinTypeNames()))\
        \ </p>\n{\n                    // the mixins have been modified but by just\
        \ looking at the diff we\n                    // can't determine where the\
        \ change happened since the diffs of either\n                    // removing\
        \ a mixin from the overlayed or adding a mixin to the\n                  \
        \  // transient state would look identical...\n                    return\
        \ false;\n                }\n\n<p>Proposed solution:</p>\n<ul class=\"alternate\"\
        \ type=\"square\">\n\t<li>Implement NameSet.equals(...) method:<br/>\n\tpublic\
        \ boolean equals(Object obj) \n<div class=\"error\"><span class=\"error\"\
        >Unknown macro: {\t\tif (obj != null &amp;&amp; obj instanceof NameSet) {\n\
        \t\t\tNameSet oo = (NameSet) obj;\n\t\t\treturn oo.names.equals(this.names);\n\
        \t\t}\t\treturn false;\t}</span> </div></li>\n</ul>"
      due: null
      environment: 'org.apache.jackrabbit.core.state.SharedItemStateManager:begin()<br/>

        org.apache.jackrabbit.core.state.NameSet:equals(Object)<br/>

        org.apache.jackrabbit.core.state.NodeStateMerger:merge(NodeState,MergeContext)'
