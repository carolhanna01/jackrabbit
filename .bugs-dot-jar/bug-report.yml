    item:
      assignee:
        '#text': Julian Reschke
        '@username': reschke
      attachments: null
      comments:
        comment:
        - '#text': '<p>When generating a directory listing, the "DirListingExportHandler"
            places the raw name of the JCR folder into the HTML markup; thus this
            can be used to inject arbitrary Javascript.</p>


            <p>Mitigation:</p>


            <p>This vulnerability only affects systems that use Jackrabbit''s WebDAV
            component. If this isn''t in use, no immediate action is required. If
            WebDAV <b>is</b> used, the "DirListingExportHandler" can be disabled by
            removing the relevant "iohandler" element from config.xml.</p>


            <p>(This issue was reported by Lars Krapf)</p>'
          '@author': reschke
          '@created': Fri, 26 Feb 2016 09:23:26 +0000
          '@id': '15168707'
        - '#text': '<p>trunk: <a href="http://svn.apache.org/r1732436" class="external-link"
