      description: '<p>When processing a WebDAV request body containing XML, the XML
        parser can be <br/>

        instructed to read content from network resources accessible to the host,
        <br/>

        identified by URI schemes such as "http(s)" or  "file". Depending on the <br/>

        WebDAV request, this can not only be used to trigger internal network <br/>

        requests, but might also be used to insert said content into the request,
        <br/>

        potentially exposing it to the attacker and others (for instance, by inserting<br/>

        said content in a WebDAV property value using a PROPPATCH request). See also<br/>

        IETF RFC 4918, Section 20.6.</p>


        <p>This issue was reported by Mikhail Egorov.</p>


        <p>Users of the jackrabbit-webdav module are advised to immediately update
        the<br/>

        module to 2.10.1 or disable WebDAV access to the repository. Users<br/>

        on earlier versions of Jackrabbit who are unable to upgrade to 2.10.1 should<br/>

        apply the fix to the corresponding 2.x branch or disable WebDAV access until<br/>

        official releases of those earlier versions are available. Patches for 2.x<br/>

        branches are attached to this JIRA issue.</p>'
